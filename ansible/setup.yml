---
- name: 用 Ansible 装修空白 ECS 服务器（安装 Docker + Nginx）
  hosts: web_servers
  gather_facts: yes
  become: yes

  tasks:
    - name: 1. 更新 apt 软件源缓存
      apt:
        update_cache: yes

    - name: 2. 安装 Nginx 和基础运维工具
      apt:
        name:
          - nginx
          - curl
          - git
          - ca-certificates
        state: present

    - name: 3. 由 Ansible 在裸机上安装 Docker 引擎
      shell: |
        curl -fsSL https://get.docker.com | bash
      args:
        creates: /usr/bin/docker  # 幂等性控制：如果 /usr/bin/docker 已经存在，就不重复安装

    - name: 4. 启动 Docker 并设置开机自启
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: 5. 安装 阿里云 ACR 免密助手 (利用 ECS 绑定的 RAM Role 免密拉取)
      get_url:
        url: https://aliyun-acr-helper.oss-cn-hangzhou.aliyuncs.com/docker-credential-acr-linux-amd64
        dest: /usr/local/bin/docker-credential-acr
        mode: '0755'

    - name: 6. 配置 Docker 默认使用 acr 免密凭证
      copy:
        content: '{"credsStore": "acr"}'
        dest: /root/.docker/config.json
        mode: '0644'

    - name: 7. 使用 Jinja2 模板动态渲染 Nginx 配置文件
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/default
      notify: Reload Nginx

    - name: 8. 确保默认软链接启用
      file:
        src: /etc/nginx/sites-available/default
        dest: /etc/nginx/sites-enabled/default
        state: link

  handlers:
    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded