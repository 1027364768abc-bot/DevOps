name: 一键创建服务器并部署（Terraform → 镜像 → ECS）

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ALIYUN_ACCOUNT_ID: "1612262844714561"
  REGION: "cn-hangzhou"
  REGISTRY: "registry.cn-hangzhou.aliyuncs.com"
  NAMESPACE: "wjthkx1006"
  IMAGE_NAME: "test1-app"
  CONTAINER_NAME: "test1-app"
  TF_STATE_BUCKET: "devops-tfstate-1612262844714561"

jobs:
  create-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 调试：打印 GitHub OIDC Token claims（临时）
        run: |
          TOKEN=$(curl -s -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -r .value)
          echo "=== OIDC Token payload ==="
          echo "$TOKEN" | cut -d. -f2 | python3 -c "import sys,base64,json; d=sys.stdin.read().strip(); d+='='*(-len(d)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(d)),indent=2))"

      - name: 3. 阿里云 OIDC 免密认证
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: acs:ram::1612262844714561:role/GitHubActionsRole
          oidc-provider-arn: acs:ram::1612262844714561:oidc-provider/GitHub
          role-session-name: GitHubActionsSession
          role-session-expiration: 3600
          audience: sigstore

      - name: 4. 安装阿里云 CLI
        run: |
          curl -fsSL -o aliyun-cli-linux-latest-amd64.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar xzf aliyun-cli-linux-latest-amd64.tgz
          sudo mv aliyun /usr/local/bin/aliyun
          aliyun version

      - name: 5. 配置阿里云 CLI 临时凭证
        run: |
          aliyun configure set \
            --profile default \
            --mode StsToken \
            --region "$REGION" \
            --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
            --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
            --sts-token "$ALIBABA_CLOUD_SECURITY_TOKEN"

      - name: 6. 安装 Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: 7. 创建 Terraform 状态存储桶（幂等）
        run: |
          aliyun oss mb "oss://${TF_STATE_BUCKET}" --region "$REGION" || echo "bucket 可能已存在，继续"
          aliyun oss ls "oss://${TF_STATE_BUCKET}" >/dev/null 2>&1 && echo "状态桶 ${TF_STATE_BUCKET} 可用"

      - name: 8. Terraform 创建/更新服务器
        working-directory: aliyun-terraform
        run: |
          export ALICLOUD_ACCESS_KEY_ID="$ALIBABA_CLOUD_ACCESS_KEY_ID"
          export ALICLOUD_ACCESS_KEY_SECRET="$ALIBABA_CLOUD_ACCESS_KEY_SECRET"
          export ALICLOUD_SECURITY_TOKEN="$ALIBABA_CLOUD_SECURITY_TOKEN"
          terraform init -input=false
          terraform apply -auto-approve -input=false
          echo "ECS_INSTANCE_ID=$(terraform output -raw ecs_instance_id)" >> "$GITHUB_ENV"
          echo "ECS_PUBLIC_IP=$(terraform output -raw ecs_public_ip)" >> "$GITHUB_ENV"

      - name: 9. 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          password: ${{ env.ALIBABA_CLOUD_SECURITY_TOKEN }}

      - name: 10. 构建并推送镜像
        run: |
          FULL_IMAGE="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -t "$FULL_IMAGE" .
          docker push "$FULL_IMAGE"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"

      - name: 11. 等待新服务器就绪（实例 Running + Docker 可用）
        run: bash scripts/wait-server-ready.sh

      - name: 12. 云助手自动部署容器到新服务器
        run: |
          DEPLOY_CMD="docker pull ${FULL_IMAGE} && docker stop ${CONTAINER_NAME} || true && docker rm ${CONTAINER_NAME} || true && docker run -d --name ${CONTAINER_NAME} -p 80:80 ${FULL_IMAGE}"
          ENCODED_CMD=$(printf '%s' "$DEPLOY_CMD" | base64 -w 0)

          aliyun ecs RunCommand \
            --RegionId "$REGION" \
            --InstanceId.1 "$ECS_INSTANCE_ID" \
            --Type "RunShellScript" \
            --CommandContent "$ENCODED_CMD"

      - name: 13. 输出访问地址
        run: |
          echo "部署完成！"
          echo "前端地址: http://${ECS_PUBLIC_IP}"
