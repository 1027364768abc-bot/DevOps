name: 零 Key OIDC 自动部署流水线

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ALIYUN_ACCOUNT_ID: "1612262844714561"
  ECS_INSTANCE_ID: "i-bp12jrnl2jaybb1ku06q"
  REGISTRY: "registry.cn-hangzhou.aliyuncs.com"
  NAMESPACE: "wjthkx1006"
  IMAGE_NAME: "test1-app"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 阿里云 OIDC 免密认证
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: acs:ram::1612262844714561:role/GitHubActionsRole
          oidc-provider-arn: acs:ram::1612262844714561:oidc-provider/GitHub
          role-session-name: GitHubActionsSession
          duration-seconds: 3600

      - name: 3. 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ env.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          password: ${{ env.ALIBABA_CLOUD_SECURITY_TOKEN }}

      - name: 4. 构建并推送镜像
        run: |
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t $FULL_IMAGE .
          docker push $FULL_IMAGE

      - name: 5. 调用云助手通知 ECS 自动部署
        run: |
          curl -O https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar xzvf aliyun-cli-linux-latest-amd64.tgz
          sudo mv aliyun /usr/local/bin/

          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          
          DEPLOY_CMD="docker pull $FULL_IMAGE && docker stop test1-app || true && docker rm test1-app || true && docker run -d --name test1-app -p 80:80 $FULL_IMAGE"
          ENCODED_CMD=$(echo "$DEPLOY_CMD" | base64 -w 0)

          aliyun ecs RunCommand \
            --RegionId "cn-hangzhou" \
            --InstanceId.1 "${{ env.ECS_INSTANCE_ID }}" \
            --Type "RunShellScript" \
            --CommandContent "$ENCODED_CMD"
