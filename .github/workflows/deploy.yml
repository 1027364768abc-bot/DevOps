name: 一键创建服务器并部署（Terraform → 镜像 → ECS）

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ALIYUN_ACCOUNT_ID: "1612262844714561"
  REGION: "cn-hangzhou"
  REGISTRY: "crpi-2xt8naw5x975swse.cn-hangzhou.personal.cr.aliyuncs.com"
  NAMESPACE: "wjthkx1006"
  IMAGE_NAME: "test1-app"
  CONTAINER_NAME: "test1-app"
  TF_STATE_BUCKET: "devops-tfstate-1612262844714561"

jobs:
  create-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 阿里云 OIDC 免密认证
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: acs:ram::1612262844714561:role/githubactionsrole
          oidc-provider-arn: acs:ram::1612262844714561:oidc-provider/GitHub
          role-session-name: GitHubActionsSession
          role-session-expiration: 3600
          audience: sigstore

      - name: 3. 安装阿里云 CLI
        run: |
          curl -fsSL -o aliyun-cli-linux-latest-amd64.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar xzf aliyun-cli-linux-latest-amd64.tgz
          sudo mv aliyun /usr/local/bin/aliyun
          aliyun version

      - name: 4. 配置阿里云 CLI 临时凭证
        run: |
          aliyun configure set \
            --profile default \
            --mode StsToken \
            --region "$REGION" \
            --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
            --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
            --sts-token "$ALIBABA_CLOUD_SECURITY_TOKEN"

      - name: 5. 安装 Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: 6. 创建 Terraform 状态存储桶（幂等）
        run: |
          aliyun oss mb "oss://${TF_STATE_BUCKET}" --region "$REGION" || echo "bucket 可能已存在，继续"
          aliyun oss ls "oss://${TF_STATE_BUCKET}" >/dev/null 2>&1 && echo "状态桶 ${TF_STATE_BUCKET} 可用"

      - name: 7. Terraform 创建/更新服务器
        working-directory: aliyun-terraform
        run: |
          export ALICLOUD_ACCESS_KEY_ID="$ALIBABA_CLOUD_ACCESS_KEY_ID"
          export ALICLOUD_ACCESS_KEY_SECRET="$ALIBABA_CLOUD_ACCESS_KEY_SECRET"
          export ALICLOUD_SECURITY_TOKEN="$ALIBABA_CLOUD_SECURITY_TOKEN"
          terraform init -input=false
          # 测试阶段每次强制重建 ECS：cloud-init 的 runcmd 只在首次启动执行，
          # 重建保证新 user_data 一定生效（公网 IP 会变化）。
          terraform apply -auto-approve -input=false -replace=alicloud_instance.ecs
          echo "ECS_INSTANCE_ID=$(terraform output -raw ecs_instance_id)" >> "$GITHUB_ENV"
          echo "ECS_PUBLIC_IP=$(terraform output -raw ecs_public_ip)" >> "$GITHUB_ENV"

      - name: 8. 登录阿里云 ACR（个人版固定密码）
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login --username "${{ secrets.ACR_USERNAME }}" --password-stdin "$REGISTRY"

      - name: 9. 构建并推送镜像
        run: |
          FULL_IMAGE="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -t "$FULL_IMAGE" .
          docker push "$FULL_IMAGE"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"

      - name: 10. 等待新服务器就绪（实例 Running + Docker 可用）
        run: bash scripts/wait-server-ready.sh

      - name: 11. 云助手自动部署容器到新服务器
        run: |
          DEPLOY_CMD=$(cat <<'SCRIPT'
          set -e
          # ACR 个人版（新 crpi- 域名）不支持 RAM 角色免密拉取，用固定密码登录
          echo '{{ACR_PASSWORD}}' | docker login --username '{{ACR_USERNAME}}' --password-stdin '{{REGISTRY}}'
          # 拉取镜像（重试 5 次，等待网络/仓库就绪）
          for attempt in 1 2 3 4 5; do
            docker pull {{FULL_IMAGE}} && break
            sleep 10
          done
          docker pull {{FULL_IMAGE}}
          docker stop {{CONTAINER_NAME}} || true
          docker rm {{CONTAINER_NAME}} || true
          docker run -d --name {{CONTAINER_NAME}} -p 80:80 {{FULL_IMAGE}}
          SCRIPT
          )
          ENCODED_CMD=$(printf '%s' "$DEPLOY_CMD" | base64 -w 0)
          PARAM_JSON=$(jq -nc \
            --arg u "${{ secrets.ACR_USERNAME }}" \
            --arg p "${{ secrets.ACR_PASSWORD }}" \
            --arg reg "$REGISTRY" \
            --arg img "$FULL_IMAGE" \
            --arg con "$CONTAINER_NAME" \
            '{ACR_USERNAME:$u, ACR_PASSWORD:$p, REGISTRY:$reg, FULL_IMAGE:$img, CONTAINER_NAME:$con}')

          aliyun ecs RunCommand \
            --RegionId "$REGION" \
            --InstanceId.1 "$ECS_INSTANCE_ID" \
            --Type "RunShellScript" \
            --ContentEncoding Base64 \
            --EnableParameter true \
            --Parameters "$PARAM_JSON" \
            --CommandContent "$ENCODED_CMD" \
            --Name deploy-frontend

      - name: 12. 输出访问地址
        run: |
          echo "部署完成！"
          echo "前端地址: http://${ECS_PUBLIC_IP}"
