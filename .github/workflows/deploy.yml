name: 零 Key OIDC 自动部署流水线

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ALIYUN_ACCOUNT_ID: "1612262844714561"
  ECS_INSTANCE_ID: "i-bp12jrnl2jaybb1ku06q"
  REGION: "cn-hangzhou"
  REGISTRY: "registry.cn-hangzhou.aliyuncs.com"
  NAMESPACE: "wjthkx1006"
  IMAGE_NAME: "test1-app"
  CONTAINER_NAME: "test1-app"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 阿里云 OIDC 免密认证
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: acs:ram::1612262844714561:role/GitHubActionsRole
          oidc-provider-arn: acs:ram::1612262844714561:oidc-provider/GitHub
          role-session-name: GitHubActionsSession
          role-session-expiration: 3600
          audience: sigstore

      - name: 3. 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          password: ${{ env.ALIBABA_CLOUD_SECURITY_TOKEN }}

      - name: 4. 构建并推送镜像
        run: |
          FULL_IMAGE="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -t "$FULL_IMAGE" .
          docker push "$FULL_IMAGE"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"

      - name: 5. 安装阿里云 CLI
        run: |
          curl -fsSL -o aliyun-cli-linux-latest-amd64.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar xzf aliyun-cli-linux-latest-amd64.tgz
          sudo mv aliyun /usr/local/bin/aliyun
          aliyun version

      - name: 6. 配置阿里云 CLI 临时凭证
        run: |
          aliyun configure set \
            --profile default \
            --mode StsToken \
            --region "$REGION" \
            --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
            --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
            --sts-token "$ALIBABA_CLOUD_SECURITY_TOKEN"

      - name: 7. 调用云助手通知 ECS 自动部署
        run: |
          DEPLOY_CMD="docker pull ${FULL_IMAGE} && docker stop ${CONTAINER_NAME} || true && docker rm ${CONTAINER_NAME} || true && docker run -d --name ${CONTAINER_NAME} -p 80:80 ${FULL_IMAGE}"
          ENCODED_CMD=$(printf '%s' "$DEPLOY_CMD" | base64 -w 0)

          aliyun ecs RunCommand \
            --RegionId "$REGION" \
            --InstanceId.1 "$ECS_INSTANCE_ID" \
            --Type "RunShellScript" \
            --CommandContent "$ENCODED_CMD"