name: 零 Key OIDC 自动部署流水线

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ALIYUN_ACCOUNT_ID: "1612262844714561"
  ECS_INSTANCE_ID: "i-bp12jrnl2jaybb1ku06q"
  REGISTRY: "registry.cn-hangzhou.aliyuncs.com"
  NAMESPACE: "devops-lab-ns" # 请确认与你在 ACR 控制台建的命名空间一致
  IMAGE_NAME: "test1-app"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      # 修正：使用正确的阿里云认证 Action 名称 (aliyun/credentials-action)
      - name: 2. 阿里云 OIDC 免密认证
        uses: aliyun/credentials-action@v1.0.0
        with:
          role-to-assume: acs:ram::${{ env.ALIYUN_ACCOUNT_ID }}:role/GitHubActionsRole
          oidc-provider-arn: acs:ram::${{ env.ALIYUN_ACCOUNT_ID }}:oidc-provider/GitHub
          role-session-name: GitHubActionsSession
          duration-seconds: 3600

      # 修正：使用标准的 Docker Login 方式，更加稳定且不依赖非官方登录 Action
      - name: 3. 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.aliyun-credentials.outputs.access-key-id || 'temp' }}
          # 提取 OIDC 换取到的临时安全令牌 (SecurityToken)
          password: ${{ env.ALIBABA_CLOUD_SECURITY_TOKEN }}

      - name: 4. 构建并推送镜像
        run: |
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t $FULL_IMAGE .
          docker push $FULL_IMAGE

      - name: 5. 调用云助手通知 ECS 自动部署
        run: |
          curl -O https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar xzvf aliyun-cli-linux-latest-amd64.tgz
          sudo mv aliyun /usr/local/bin/

          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          
          DEPLOY_CMD="docker pull $FULL_IMAGE && docker stop test1-app || true && docker rm test1-app || true && docker run -d --name test1-app -p 8080:80 $FULL_IMAGE"
          ENCODED_CMD=$(echo "$DEPLOY_CMD" | base64 -w 0)

          aliyun ecs RunCommand \
            --RegionId "cn-hangzhou" \
            --InstanceId.1 "${{ env.ECS_INSTANCE_ID }}" \
            --Type "RunShellScript" \
            --CommandContent "$ENCODED_CMD"