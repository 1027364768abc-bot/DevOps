name: 一键释放测试环境（Terraform destroy）

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  REGION: "cn-hangzhou"

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 阿里云 OIDC 免密认证
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: acs:ram::1612262844714561:role/githubactionsrole
          oidc-provider-arn: acs:ram::1612262844714561:oidc-provider/GitHub
          role-session-name: GitHubActionsSession
          role-session-expiration: 3600
          audience: sigstore

      - name: 3. 安装阿里云 CLI
        run: |
          curl -fsSL -o aliyun-cli-linux-latest-amd64.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar xzf aliyun-cli-linux-latest-amd64.tgz
          sudo mv aliyun /usr/local/bin/aliyun

      - name: 4. 配置阿里云 CLI 临时凭证
        run: |
          aliyun configure set \
            --profile default \
            --mode StsToken \
            --region "$REGION" \
            --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
            --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
            --sts-token "$ALIBABA_CLOUD_SECURITY_TOKEN"

      - name: 5. 安装 Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: 6. 销毁 Terraform 资源（ECS / VPC / 安全组 / RAM 角色）
        working-directory: aliyun-terraform
        run: |
          export ALICLOUD_ACCESS_KEY_ID="$ALIBABA_CLOUD_ACCESS_KEY_ID"
          export ALICLOUD_ACCESS_KEY_SECRET="$ALIBABA_CLOUD_ACCESS_KEY_SECRET"
          export ALICLOUD_SECURITY_TOKEN="$ALIBABA_CLOUD_SECURITY_TOKEN"
          terraform init -input=false
          terraform destroy -auto-approve -input=false

      - name: 7. 删除 OSS 状态桶（含状态文件）
        run: |
          TF_BUCKET="devops-tfstate-1612262844714561"
          # 先清空对象，再删 bucket（幂等：bucket 不存在时忽略错误）
          aliyun oss rm -r -f "oss://${TF_BUCKET}/" --region "$REGION" >/dev/null 2>&1 || true
          aliyun oss rm -b -f "oss://${TF_BUCKET}" --region "$REGION" >/dev/null 2>&1 || \
            aliyun oss rm -r -f "oss://${TF_BUCKET}" --region "$REGION" >/dev/null 2>&1 || true
          # 校验确实已删除
          if aliyun oss ls "oss://${TF_BUCKET}" --region "$REGION" >/dev/null 2>&1; then
            echo "ERROR: 状态桶 ${TF_BUCKET} 仍然存在" >&2
            exit 1
          fi
          echo "OSS 状态桶 ${TF_BUCKET} 已删除"

      - name: 8. 确认本项目 ECS 已全部释放
        run: |
          LEFTOVER=$(aliyun ecs DescribeInstances --RegionId "$REGION" | jq -r '.Instances.Instance[]? | select(.InstanceName == "devops-ecs-node") | .InstanceId')
          if [ -n "$LEFTOVER" ]; then
            echo "仍有未释放实例: $LEFTOVER" >&2
            exit 1
          fi
          echo "本项目 ECS 已全部释放"
